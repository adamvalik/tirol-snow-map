name: Something is wrong
description: A bug, wrong data, or something that does not work on your device.
labels: [bug, feedback]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps if you have one (paste or drag it in).
    validations:
      required: true
  - type: input
    id: view
    attributes:
      label: View link
      description: Filled in when you open this from the app's "About the data".
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the end of "About the data", for example v0.2.0 · abc1234.
  - type: input
    id: device
    attributes:
      label: Device and browser
