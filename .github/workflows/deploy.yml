# Production: three times a day, refreshes the data and publishes the app with it to GitHub Pages.
#
# Data that must survive between runs (the files the app reads, the 14-day history, classified
# Sentinel-2 days, the forecast grid) travels in an Actions cache; the OSM basemap is rebuilt once
# a month. A failed upstream never stops the deploy: the app then shows the last good data with a
# warning, and scripts/monitor.mjs opens an issue when a step keeps failing.
#
# One-time setup: Settings → Pages → Source "GitHub Actions"; secrets CDSE_USERNAME, CDSE_PASSWORD,
# CDSE_CLIENT_ID, CDSE_CLIENT_SECRET. Scheduled runs only happen on the default branch.
name: Update data and deploy

on:
  # Cron is UTC: 03:47, 11:47 and 17:47 UTC are 04:47, 12:47 and 18:47 in South Tyrol in winter, an
  # hour later in summer. Sentinel-2 passes around 10:00 UTC and is published by about 17:00 UTC, so
  # the evening run usually shows the same day's pass, and the morning run catches a late one.
  # GitHub often starts scheduled runs late, so none sits on the full hour.
  schedule:
    - cron: '47 3,11,17 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DATA_PATHS: |
    web/public/data
    data/state

jobs:
  build:
    # Pinned like ci.yml: ubuntu-latest moved to 26.04, where Playwright 1.56 cannot install its
    # browser (needed for the link preview picture).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      generated_at: ${{ steps.built.outputs.generated_at }}
    permissions:
      contents: read
      actions: write # prune old data caches
      issues: write # monitoring issue
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Restore data from the previous run
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATA_PATHS }}
          key: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-data-

      - name: Month for the basemap cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the basemap
        id: basemap
        uses: actions/cache@v4
        with:
          path: web/public/basemap
          key: basemap-${{ steps.month.outputs.month }}
      - name: Build the basemap (once a month)
        if: steps.basemap.outputs.cache-hit != 'true'
        run: npm run basemap

      - name: Run the pipeline
        id: pipeline
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        # Exit code 2 means some upstream failed and the files carry the last good data; anything
        # else non-zero is a crash, and the restored data from the previous run is deployed as is.
        run: |
          set +e
          npm run pipeline
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save data for the next run
        if: steps.pipeline.outputs.exit == '0' || steps.pipeline.outputs.exit == '2'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DATA_PATHS }}
          key: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}

      - run: npm run build
        env:
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables):
          # the address the feedback links write to, and the GoatCounter site code. Unset turns
          # either off. Both end up in the public page, so use an address meant for it.
          FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          # The site's address for the link preview tags; unset means the github.io address.
          SITE_URL: ${{ vars.SITE_URL }}
      # The picture chat apps show for a shared link: today's map, rendered from the build. If it
      # fails, the live site's picture from an earlier run is kept, so the preview never goes blank.
      - name: Render the link preview picture
        run: |
          if npx playwright install --with-deps chromium && node scripts/og-image.mjs --out dist/og.jpg; then exit 0; fi
          site=$(grep -o '<meta property="og:url" content="[^"]*"' dist/index.html | sed 's/.*content="//; s/"$//')
          echo "::warning::The link preview picture could not be rendered; keeping the live one from ${site}og.jpg"
          curl -fsS "${site}og.jpg" -o dist/og.jpg || { rm -f dist/og.jpg; echo "::warning::No link preview picture on the live site either"; }
      - name: Note which data is in the build
        id: built
        run: echo "generated_at=$(node -p "require('./dist/data/status.json').generatedAt" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Report data problems
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_EXIT: ${{ steps.pipeline.outputs.exit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/monitor.mjs

      - name: Prune old data caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key pipeline-data- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # On 9 Nov 2026 a deployment reported success while the site kept serving the previous
      # run's files. Check that the live site really has this run's data, and fail loudly if not.
      - name: Check the live site serves this run's data
        if: needs.build.outputs.generated_at != ''
        env:
          EXPECTED: ${{ needs.build.outputs.generated_at }}
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 20); do
            live=$(curl -fsS "${SITE}data/status.json?run=${GITHUB_RUN_ID}-$i" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).generatedAt" || true)
            if [ "$live" = "$EXPECTED" ]; then echo "Live site serves data from $live"; exit 0; fi
            echo "Live site has data from ${live:-nothing}, expected $EXPECTED; waiting"
            sleep 30
          done
          echo "::error::The live site still serves data from $live after 10 minutes, although the deployment reported success. Re-run this workflow."
          exit 1

  # GitHub switches scheduled workflows off after 60 days without commits in a public repository, and
  # the data deploys are not commits. Enabling the workflow through the API restarts that count, so
  # the site keeps updating through a winter without code changes. In case that ever stops working,
  # an issue is opened once the last commit is 50 days old, before the switch-off.
  keep-schedule:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Re-enable this workflow
        run: gh api --method PUT "repos/$REPO/actions/workflows/deploy.yml/enable"
      - name: Warn before the 60-day switch-off
        run: |
          last=$(gh api "repos/$REPO/commits?per_page=1" --jq '.[0].commit.committer.date')
          days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Last commit on the default branch: $last ($days days ago)"
          [ "$days" -lt 50 ] && exit 0
          title="Scheduled data updates: no commit for $days days"
          if [ -n "$(gh issue list -R "$REPO" --state open --search "in:title Scheduled data updates: no commit" --json number --jq '.[0].number')" ]; then exit 0; fi
          gh issue create -R "$REPO" --title "$title" --body "The last commit on the default branch was $days days ago ($last). GitHub switches scheduled workflows off after 60 days without commits; this workflow re-enables itself through the API on every scheduled run, which should prevent that. To be safe, push any commit (or check *Actions → Update data and deploy* is still enabled) and close this issue."
