# Checks every pull request: tests, typecheck, build, and the browser smoke test.
#
# Runs offline on the fixture data (`npm run pipeline:fixtures`), so it needs no secrets and gives
# the same result on every run. The basemap is taken from production's monthly cache when there is
# one (read only); without it the app shows its basemap warning and the smoke test still runs.
# Production (deploy.yml) and the live data check (snow-check.yml) are unchanged.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install its browser on.
    # Move to ubuntu-latest again with a Playwright release that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Data from fixtures
        run: npm run pipeline:fixtures
      - name: Basemap from production's cache (if any)
        uses: actions/cache/restore@v4
        with:
          path: web/public/basemap
          key: basemap-none
          restore-keys: basemap-
      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        env:
          # Runners render WebGL in software and fetch terrain tiles cold, so load time varies a lot.
          # The time is printed but only gated at the 90 s the test waits anyway; 5 s is the target
          # on real hardware (the default when run locally).
          SMOKE_READY_LIMIT_MS: 90000
        run: npm run smoke -- --out smoke-output
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-output/
          retention-days: 7
